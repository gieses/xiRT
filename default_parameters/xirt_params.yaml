# xiRT 2.0.0 PyTorch network
LSTM:
  activation: tanh
  activity_regularization: l2
  activityregularizer_value: 0.001
  bidirectional: true
  kernel_regularization: l2
  kernelregularizer_value: 0.001
  lstm_bn: true
  nlayers: 1
  type: GRU
  units: 50
dense:
  # Lists must contain nlayers entries.
  activation: [relu, relu, relu]
  dense_bn: [true, true, true]
  dropout: [0.1, 0.1, 0.1]
  kernel_regularizer: [l2, l2, l2]
  regularization: [true, true, true]
  regularizer_value: [0.001, 0.001, 0.001]
  neurons: [300, 150, 50]
  nlayers: 3
embedding:
  length: 50
learning:
  batch_size: 512
  epochs: 50
  learningrate: 0.01
  verbose: 1
  optimizer: adamw
  seed: 42
  device: cpu
  deterministic: true
  clip_norm: 5.0
output:
  # Set task columns and dimensions for the input table.
  hsax-activation: sigmoid
  hsax-column: hsax_ordinal
  hsax-dimension: 10
  hsax-loss: binary_crossentropy
  hsax-metrics: mse
  hsax-weight: 50
  rp-activation: linear
  rp-column: rp
  rp-dimension: 1
  rp-loss: mse
  rp-metrics: mse
  rp-weight: 1
siamese:
  use: true
  merge_type: add
  single_predictions: true
callbacks:
  check_point: true
  log_csv: true
  early_stopping: true
  early_stopping_patience: 15
  tensor_board: false
  progressbar: true
  reduce_lr: true
  reduce_lr_factor: 0.5
  reduce_lr_patience: 15
predictions:
  # The historical key continues denotes continuous targets.
  continues: [rp]
  fractions: [hsax]

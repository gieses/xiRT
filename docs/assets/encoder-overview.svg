<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img" aria-labelledby="title description">
  <title id="title">From peptide sequences to retention predictions</title>
  <desc id="description">Two peptide inputs use a shared recurrent encoder, followed by prediction heads for retention times and fractions. This is an architecture schematic, not measured data.</desc>
  <style>
    .surface { fill: #fff; stroke: #dce7ec; }
    .text { fill: #123c50; }
    .muted { fill: #526675; }
    .chip { fill: #f2f7f9; stroke: #dce7ec; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #172b3a; stroke: #35505f; }
      .text { fill: #e5edf3; }
      .muted { fill: #b2c4d2; }
      .chip { fill: #203c4d; stroke: #35505f; }
    }
    text { font-family: Inter, Aptos, Segoe UI, Arial, sans-serif; }
  </style>
  <defs>
    <linearGradient id="encoder" x2="1" y2="1">
      <stop stop-color="#174c64"/>
      <stop offset="1" stop-color="#087e80"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="m1 1 4 3-4 3" fill="none" stroke="#72a0ad" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect class="surface" x="1" y="1" width="478" height="398" rx="24"/>
  <text class="muted" x="32" y="41" font-size="11" font-weight="700" letter-spacing="1.5">ONE ENCODER, SHARED WEIGHTS</text>
  <rect class="chip" x="32" y="66" width="190" height="66" rx="12"/>
  <rect class="chip" x="258" y="66" width="190" height="66" rx="12"/>
  <text class="muted" x="48" y="89" font-size="12">Peptide 1</text>
  <text class="muted" x="274" y="89" font-size="12">Peptide 2</text>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4">
    <path d="m49 111 20-8 20 8 20-8 20 8 20-8 20 8 20-8" stroke="#13a792"/>
    <path d="m275 111 20-8 20 8 20-8 20 8 20-8 20 8 20-8" stroke="#4b9bd0"/>
  </g>
  <g fill="none" stroke="#72a0ad" stroke-width="2" marker-end="url(#arrow)">
    <path d="M127 133v26q0 12 12 12h39v17"/>
    <path d="M353 133v26q0 12-12 12h-39v17"/>
    <path d="M240 266v35"/>
  </g>
  <rect x="62" y="190" width="356" height="76" rx="16" fill="url(#encoder)"/>
  <text x="240" y="222" text-anchor="middle" fill="#fff" font-size="20" font-weight="650">Shared GRU / LSTM</text>
  <text x="240" y="245" text-anchor="middle" fill="#c3efed" font-size="13">Trainable peptide embeddings</text>
  <rect class="chip" x="90" y="306" width="300" height="54" rx="12"/>
  <text class="text" x="240" y="329" text-anchor="middle" font-size="16" font-weight="650">Task-specific prediction heads</text>
  <text class="muted" x="240" y="348" text-anchor="middle" font-size="12">Continuous RT or fraction labels</text>
  <text class="muted" x="240" y="382" text-anchor="middle" font-size="10">Crosslink model schematic; linear peptides use one input.</text>
</svg>

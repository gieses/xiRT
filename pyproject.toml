[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xirt-torch"
version = "2.0.1"
description = "Multi-dimensional retention time prediction for linear and crosslinked peptides"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENCE"]
authors = [{name = "Sven Giese", email = "sven.giese@hpi.de"}]
keywords = ["proteomics", "crosslinking", "retention time", "chromatography", "PyTorch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "torch>=2.9,<3",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "biopython>=1.85",
    "pyteomics>=4.7",
    "pyyaml>=6",
    "matplotlib>=3.9",
    "seaborn>=0.13,<0.14",
    "palettable>=3.3",
    "statannotations>=0.7",
    "pydantic>=2.10,<3",
    "tqdm>=4.67",
    "marimo>=0.25.1",
]

[project.optional-dependencies]
cpu = ["torch>=2.9,<3"]
cuda = ["torch>=2.9,<3"]
esm = ["esm>=3.2.3,<3.3; python_version == '3.12'"]
experiments = ["lion-pytorch"]
tracking = ["mlflow>=3,<4"]
tensorboard = ["tensorboard"]
[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "twine",
    "pre-commit>=4.6.2",
]
docs = ["mkdocs-material", "mkdocstrings[python]", "mkdocs>=1.6,<2"]

[project.scripts]
xirt = "xirt.__main__:main"

[project.urls]
Homepage = "https://github.com/gieses/xiRT"
Documentation = "https://gieses.github.io/xiRT/"
Repository = "https://github.com/gieses/xiRT"
Issues = "https://github.com/gieses/xiRT/issues"

[tool.setuptools.packages.find]
include = ["xirt", "xirt.*"]
exclude = ["tests*", "benchmark*", "documentation*", "xirt.data_pipelines.benchmarks*"]

[tool.setuptools]
include-package-data = false

[tool.uv]
conflicts = [[{extra = "cpu"}, {extra = "cuda"}]]

[tool.uv.sources]
torch = [
    {index = "pytorch-cpu", extra = "cpu"},
    {index = "pytorch-cu130", extra = "cuda"},
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
norecursedirs = [".git", ".venv", "build", "dist", "documentation", "benchmark"]
markers = [
    "gpu: requires a CUDA-capable device (manual integration workflow)",
    "esm: requires optional ESM dependencies and locally available model weights",
    "esmc: requires authorized, locally cached ESM-C model weights",
    "integration: optional integration tests that may download model weights",
]

[tool.ruff]
target-version = "py312"
line-length = 100
force-exclude = true
include = [
    "xirt/**/*.py",
    "tests/**/*.py",
    "examples/**/*.py",
    ".github/scripts/*.py",
]

[tool.ruff.format]
exclude = [
    "tests/__init__.py",
    "tests/test_features.py",
    "tests/test_main.py",
    "tests/test_predictor.py",
    "tests/test_processing.py",
    "tests/test_qc.py",
    "tests/test_sequences.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/__init__.py" = ["E4", "E7", "F401", "F403", "F405", "F541", "F841", "I", "UP"]
"tests/test_features.py" = ["E4", "E7", "F401", "F403", "F405", "F541", "F841", "I", "UP"]
"tests/test_main.py" = ["E4", "E7", "F401", "F403", "F405", "F541", "F841", "I", "UP"]
"tests/test_predictor.py" = ["E4", "E7", "F401", "F403", "F405", "F541", "F841", "I", "UP"]
"tests/test_processing.py" = ["E4", "E7", "F401", "F403", "F405", "F541", "F841", "I", "UP"]
"tests/test_qc.py" = ["E4", "E7", "F401", "F403", "F405", "F541", "F841", "I", "UP"]
"tests/test_sequences.py" = ["E4", "E7", "F401", "F403", "F405", "F541", "F841", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["xirt/xirtnet.py", "xirt/embeddings.py", "xirt/training.py", "xirt/config.py",
         "xirt/adapters.py", "xirt/tracking.py", "xirt/faims.py", "xirt/explain.py"]
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

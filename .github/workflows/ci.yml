name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  CUDA_VISIBLE_DEVICES: ""
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  tests:
    name: CPU / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.13.0"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install CPU dependencies
        run: uv sync --locked --extra cpu --group dev --extra tracking
      - name: Check modern modules and new tests
        run: uv run --no-sync ruff check .
      - name: Check modern formatting and notebook dataflow
        run: |
          uv run --no-sync ruff format --check --quiet .
          uv run --no-sync marimo check --strict xirt/data_pipelines/benchmarks/tf_torch/analyze_results.py examples/train_predict.py examples/fine_tune.py
      - name: Fatal checks across retained code and tests
        run: uv run --no-sync ruff check --isolated --select E9,F63,F7,F82 xirt tests
      - name: Type-check modern modules
        run: uv run --no-sync mypy
      - name: Run CPU tests, including retained legacy tests
        run: uv run --no-sync pytest -m "not gpu and not esm and not esmc and not integration" --cov=xirt --cov-report=term-missing --cov-report=xml:coverage.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: error

  package:
    name: Build and install distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.13.0"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --extra cpu --group dev
      - name: Build wheel from sdist and validate metadata
        run: |
          uv build
          uv run --no-sync twine check --strict dist/*
          uv run --no-sync python .github/scripts/validate_release.py
      - name: Install wheel in a clean environment (not the source tree)
        run: |
          uv venv .wheel-env --python 3.13
          uv pip install --python .wheel-env/bin/python --torch-backend cpu dist/*.whl
          .wheel-env/bin/python -I -c "from importlib.metadata import version; import xirt; from xirt.xirtnet import xiRTNET; assert version('xirt-torch') == xirt.__version__"
          .wheel-env/bin/xirt --help
          .wheel-env/bin/xirt --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-distributions
          path: dist/*
          if-no-files-found: error

  docs:
    name: Strict scientific documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.13.0"
          python-version: "3.13"
          enable-cache: true
      - name: Install documentation dependencies
        run: |
          uv sync --locked --extra cpu --group docs
      - run: uv run --no-sync mkdocs build --strict
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-site
          path: site/
          if-no-files-found: error

name: Deploy Material documentation

on:
  push:
    branches: [master]
    paths:
      - docs/**
      - xirt/**
      - mkdocs.yml
      - pyproject.toml
      - uv.lock
      - README.md
      - .github/scripts/check_docs_links.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  MPLBACKEND: Agg
  CUDA_VISIBLE_DEVICES: ""

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.13.0"
          python-version: "3.13"
          enable-cache: true
      - name: Read manually configured Pages metadata
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - name: Install CPU package and documentation dependencies
        run: |
          uv sync --locked --extra cpu --group docs
      - name: Build Material site with strict validation
        run: |
          uv run --no-sync mkdocs build --strict
          uv run --no-sync python .github/scripts/check_docs_links.py
      - name: Upload only the generated static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
